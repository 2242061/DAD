# Substituir REGISTRY, GG e HOST_ESTG pelos valores atribuídos pela ESTG.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dad-sqlite
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: backend
          image: REGISTRY/grp-GG/backend:intermediate
          ports: [{containerPort: 8000}]
          envFrom: [{secretRef: {name: dad-secret}}]
          env:
            - {name: APP_ENV, value: production}
            - {name: APP_DEBUG, value: "false"}
            - {name: LOG_CHANNEL, value: stderr}
            - {name: DB_CONNECTION, value: sqlite}
            - {name: DB_DATABASE, value: /data/database.sqlite}
            - {name: CACHE_STORE, value: file}
            - {name: SESSION_DRIVER, value: file}
            - {name: QUEUE_CONNECTION, value: sync}
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe:
            httpGet: {path: /up, port: 8000}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes: [{name: data, persistentVolumeClaim: {claimName: dad-sqlite}}]
---
apiVersion: v1
kind: Service
metadata: {name: backend}
spec:
  selector: {app: backend}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: realtime}
spec:
  replicas: 1
  selector:
    matchLabels: {app: realtime}
  template:
    metadata:
      labels: {app: realtime}
    spec:
      containers:
        - name: realtime
          image: REGISTRY/grp-GG/realtime:intermediate
          ports: [{containerPort: 3001}]
          readinessProbe:
            httpGet: {path: /health, port: 3001}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: realtime}
spec:
  selector: {app: realtime}
  ports: [{port: 3001, targetPort: 3001}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: REGISTRY/grp-GG/frontend:intermediate
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: frontend}
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dad-intermediate
spec:
  rules:
    - host: HOST_ESTG
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {number: 80}
