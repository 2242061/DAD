# R3 — SPA Vue, grupo 20. Não substitui os Deployments de R1 e R2.
# O Ingress encaminha os três serviços no MESMO domínio do frontend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-r3
  namespace: dad-group-20
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-r3
  template:
    metadata:
      labels:
        app: frontend-r3
    spec:
      containers:
        - name: frontend-r3
          image: registry-172.22.21.115.sslip.io/dad-group-20/frontend-r3:v1.0.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-r3
  namespace: dad-group-20
spec:
  selector:
    app: frontend-r3
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dad-r3
  namespace: dad-group-20
spec:
  ingressClassName: traefik
  rules:
    - host: web-dad-group-20-172.22.21.253.sslip.io
      http:
        paths:
          # Rotas longas prevalecem sobre /.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-r1
                port:
                  number: 8000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: realtime-r2
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-r3
                port:
                  number: 80
