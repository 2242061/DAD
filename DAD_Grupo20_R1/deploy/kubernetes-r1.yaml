# DAD — Grupo 20 — apenas R1 (Laravel API)
# Namespace e endereços retirados dos tutoriais; confirmar no cluster da ESTG.
# Antes de aplicar: criar o Secret dad-r1-secret seguindo o README.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dad-r1-sqlite
  namespace: dad-group-20
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-r1
  namespace: dad-group-20
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: backend-r1}
  template:
    metadata:
      labels: {app: backend-r1}
    spec:
      containers:
        - name: backend-r1
          image: registry-172.22.21.115.sslip.io/dad-group-20/backend-r1:v1.0.0
          ports: [{containerPort: 8000}]
          envFrom: [{secretRef: {name: dad-r1-secret}}]
          env:
            - {name: APP_ENV, value: production}
            - {name: APP_DEBUG, value: "false"}
            - {name: LOG_CHANNEL, value: stderr}
            - {name: DB_CONNECTION, value: sqlite}
            - {name: DB_DATABASE, value: /data/database.sqlite}
            - {name: CACHE_STORE, value: file}
            - {name: SESSION_DRIVER, value: file}
            - {name: QUEUE_CONNECTION, value: sync}
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe:
            httpGet: {path: /up, port: 8000}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes: [{name: data, persistentVolumeClaim: {claimName: dad-r1-sqlite}}]
---
apiVersion: v1
kind: Service
metadata:
  name: backend-r1
  namespace: dad-group-20
spec:
  selector: {app: backend-r1}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dad-r1
  namespace: dad-group-20
spec:
  rules:
    - host: api-dad-group-20-172.22.21.253.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-r1
                port: {number: 8000}
